apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-alerting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lara-portilho/FIAP-DevOps-kubernetes.git
    targetRevision: main
    path: manifests/observability/alerting
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
