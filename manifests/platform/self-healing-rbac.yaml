# Permissão mínima para o workflow de Self-Healing (.github/workflows/self-healing.yml).
# O usuário IAM togglemaster-self-healing (ligado ao cluster em FIAP-DevOps-terraform/self-healing.tf) entra no grupo
# "togglemaster:self-healing" via EKS access entry; aqui esse grupo só pode reiniciar deployments
# e ler pods/eventos no namespace togglemaster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing
  namespace: togglemaster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing
  namespace: togglemaster
subjects:
  - kind: Group
    name: togglemaster:self-healing
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: self-healing
  apiGroup: rbac.authorization.k8s.io
