apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: togglemaster
data:
  AWS_REGION: us-east-1
  AUTH_SERVICE_URL: http://auth-service:8001
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
  # OpenTelemetry: todos os servicos enviam traces/metricas para o Alloy (OTLP/HTTP).
  # O nome de cada servico (OTEL_SERVICE_NAME) fica no deployment.yaml dele.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_SEMCONV_STABILITY_OPT_IN: http
