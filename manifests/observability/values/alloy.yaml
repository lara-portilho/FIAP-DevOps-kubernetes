# Grafana Alloy como coletor OpenTelemetry central (no lugar do OTel Collector).
# DaemonSet: 1 pod por no, que
#   1. recebe OTLP (traces e metricas) dos 5 microsservicos via Service "alloy"
#      (alloy.observability.svc:4317 gRPC / :4318 HTTP);
#   2. le os logs de TODOS os containers do no em /var/log/pods.
# Tudo passa pelo mesmo pipeline otelcol.* (k8sattributes -> memory_limiter ->
# batch) e sai para Prometheus (metricas), Loki (logs) e New Relic (APM).
#
# A UI do Alloy mostra esse grafo de componentes ao vivo:
#   kubectl -n observability port-forward ds/alloy 12345
controller:
  type: daemonset

alloy:
  mounts:
    varlog: true

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  # NEW_RELIC_LICENSE_KEY (gerado pelo render-secrets.sh, fora do Git)
  envFrom:
    - secretRef:
        name: newrelic-license

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  configMap:
    create: true
    content: |-
      // =====================================================================
      // 1. ENTRADA: OTLP enviado pelos microsservicos (SDKs OpenTelemetry)
      // =====================================================================
      otelcol.receiver.otlp "apps" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces  = [otelcol.processor.k8sattributes.default.input]
          metrics = [otelcol.processor.k8sattributes.default.input]
          logs    = [otelcol.processor.k8sattributes.default.input]
        }
      }

      // =====================================================================
      // 2. PROCESSAMENTO
      // =====================================================================
      // Enriquece a telemetria com metadados do Kubernetes, identificando o pod
      // de origem pelo IP da conexao.
      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = [
            "k8s.namespace.name",
            "k8s.pod.name",
            "k8s.deployment.name",
            "k8s.node.name",
          ]
        }
        output {
          traces  = [otelcol.processor.memory_limiter.default.input]
          metrics = [otelcol.processor.memory_limiter.default.input]
          logs    = [otelcol.processor.memory_limiter.default.input]
        }
      }

      // Protege o coletor: recusa dados antes de estourar o limite do container.
      otelcol.processor.memory_limiter "default" {
        check_interval = "1s"
        limit          = "400MiB"
        output {
          traces  = [otelcol.processor.batch.default.input]
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
        }
      }

      // Agrupa em lotes e roteia cada sinal para os backends.
      otelcol.processor.batch "default" {
        output {
          traces  = [
            otelcol.connector.spanmetrics.red.input,
            otelcol.exporter.otlphttp.newrelic.input,
          ]
          metrics = [
            otelcol.exporter.prometheus.default.input,
            otelcol.exporter.otlphttp.newrelic.input,
          ]
          logs    = [
            otelcol.processor.attributes.loki_labels.input,
            otelcol.processor.filter.newrelic_logs.input,
          ]
        }
      }

      // Metricas RED (taxa, erros, duracao) derivadas dos spans SERVER/CLIENT de
      // todos os servicos -- serie uniforme para Go e Python, usada no dashboard
      // e no alerta de 5xx:
      //   traces_span_metrics_calls_total{service_name, span_kind, status_code, http_response_status_code}
      //   traces_span_metrics_duration_seconds_bucket{...}
      otelcol.connector.spanmetrics "red" {
        dimension {
          name = "http.response.status_code"
        }
        dimension {
          name = "http.request.method"
        }
        histogram {
          unit = "s"
          explicit {
            buckets = ["10ms", "25ms", "50ms", "100ms", "250ms", "500ms", "1s", "2.5s", "5s"]
          }
        }
        output {
          metrics = [otelcol.exporter.prometheus.default.input]
        }
      }

      // =====================================================================
      // 3. SAIDAS
      // =====================================================================
      // --- Metricas -> Prometheus (remote_write) ---
      otelcol.exporter.prometheus "default" {
        // atributos de recurso (service.name, k8s.*) viram labels
        resource_to_telemetry_conversion = true
        forward_to = [prometheus.remote_write.default.receiver]
      }

      prometheus.remote_write "default" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write"
        }
      }

      // --- Logs -> Loki ---
      // Indica ao exporter quais atributos viram labels no Loki.
      otelcol.processor.attributes "loki_labels" {
        action {
          key    = "loki.attribute.labels"
          action = "upsert"
          value  = "namespace, pod, container, app, level"
        }
        output {
          logs = [otelcol.exporter.loki.default.input]
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // --- Traces, metricas e logs -> New Relic (APM) via OTLP ---
      // Para o New Relic vao so os logs do ToggleMaster (economiza a cota gratuita);
      // o Loki recebe os logs do cluster inteiro.
      otelcol.processor.filter "newrelic_logs" {
        error_mode = "ignore"
        logs {
          log_record = [
            "attributes[\"namespace\"] != nil and attributes[\"namespace\"] != \"togglemaster\"",
          ]
        }
        output {
          logs = [otelcol.exporter.otlphttp.newrelic.input]
        }
      }

      otelcol.exporter.otlphttp "newrelic" {
        client {
          endpoint = "https://otlp.nr-data.net"
          headers  = {
            "api-key" = sys.env("NEW_RELIC_LICENSE_KEY"),
          }
        }
      }

      // =====================================================================
      // 4. LOGS DE TODOS OS CONTAINERS DO NO (stdout/stderr)
      // =====================================================================
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ""
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Formato CRI do containerd + campos dos logs JSON dos microsservicos
      // (level e trace_id, este ultimo para correlacionar log -> trace).
      loki.process "pods" {
        stage.cri {}

        stage.json {
          expressions = { level = "level", trace_id = "trace_id" }
        }

        stage.labels {
          values = { level = "" }
        }

        forward_to = [otelcol.receiver.loki.pods.receiver]
      }

      // Converte para OTLP e entra no mesmo pipeline (batch -> Loki + New Relic)
      otelcol.receiver.loki "pods" {
        output {
          logs = [otelcol.processor.batch.default.input]
        }
      }
