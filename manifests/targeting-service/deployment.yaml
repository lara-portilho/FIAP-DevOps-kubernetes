apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      initContainers:
        - name: migrate-db
          image: postgres:15-alpine
          command: ["sh", "-c", "psql $DATABASE_URL -f /migrations/targeting.sql"]
          envFrom:
            - secretRef:
                name: targeting-service-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: targeting-db-migrations
      containers:
        - name: targeting-service
          image: PLACEHOLDER/togglemaster/targeting-service:pending
          ports:
            - containerPort: 8003
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: targeting-service-secrets
            - configMapRef:
                name: shared-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
