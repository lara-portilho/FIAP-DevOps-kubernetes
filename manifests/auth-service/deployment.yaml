apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle-master
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: migrate-db
          image: postgres:15-alpine
          command: ["sh", "-c", "psql $DATABASE_URL -f /migrations/auth.sql && psql $DATABASE_URL -f /seed/seed.sql"]
          envFrom:
            - secretRef:
                name: auth-service-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
            - name: seed
              mountPath: /seed
      containers:
        - name: auth-service
          image: # (Mantém a imagem que já está configurada no teu repositório)
          ports:
            - containerPort: 8080
          env:
            # Variáveis de Ambiente do OpenTelemetry (Traces & Métricas para o New Relic)
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.toggle-master.svc.cluster.local:4317"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
      volumes:
        - name: migrations
          configMap:
            name: auth-service-migrations
        - name: seed
          configMap:
            name: auth-service-seed
